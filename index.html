<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vicini di Strada Como - Mappa Interattiva Servizi</title>
    
    <!-- Meta tag PWA & Mobile -->
    <meta name="theme-color" content="#124d35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ViciniDiStrada">
    <meta name="description" content="Mappa interattiva dei servizi per la grave marginalità a Como">

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        const isGhPages = window.location.pathname.startsWith('/portaleaccoglienzacomo');
        const basePath = isGhPages ? "portaleaccoglienzacomo/" : "";
        const baseScope = isGhPages ? "/portaleaccoglienzacomo/" : "/";

        await OneSignal.init({
          appId: "b454646f-7e4b-4ef3-95f6-f399bf2a3826",
          serviceWorkerPath: basePath + "onesignal/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: baseScope + "onesignal/" },
          allowLocalhostAsSecureOrigin: true
        });

        // Se l'utente ha già abilitato le notifiche nel browser/telefono, assicurati che la registrazione OneSignal sia attiva
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          if (OneSignal.User && OneSignal.User.PushSubscription) {
            try {
              if (!OneSignal.User.PushSubscription.optedIn) {
                await OneSignal.User.PushSubscription.optIn();
                console.log('[OneSignal] Sottoscrizione push attivata automaticamente con successo');
              }
            } catch (e) {}
          }
        }

        const currentLang = localStorage.getItem('vicini_lang') || 'it';
        if (OneSignal.User && OneSignal.User.setLanguage) {
          try {
            await OneSignal.User.setLanguage(currentLang);
            console.log('[OneSignal] Lingua utente sincronizzata:', currentLang);
          } catch (e) {}
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
