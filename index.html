<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vicini di Strada Como - Mappa Interattiva Servizi</title>
    
    <!-- Meta tag PWA & Mobile -->
    <meta name="theme-color" content="#124d35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ViciniDiStrada">
    <meta name="description" content="Mappa interattiva dei servizi per la grave marginalità a Como">

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">

    <!-- OneSignal Web Push SDK -->
    <script>
      window.__oneSignalReady = false;
      window.__oneSignalLoadError = false;
      window.__oneSignalInitError = null;
      window.__oneSignalInstance = null;
      window.OneSignalDeferred = window.OneSignalDeferred || [];
    </script>
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      onerror="window.__oneSignalLoadError = true;"
    ></script>
    <script>
      window.OneSignalDeferred.push(async function(OneSignal) {
        const isGhPages = window.location.pathname.startsWith('/portaleaccoglienzacomo');
        const swDir = isGhPages ? "/portaleaccoglienzacomo/push/onesignal/" : "/push/onesignal/";

        try {
          await OneSignal.init({
            appId: "b454646f-7e4b-4ef3-95f6-f399bf2a3826",
            serviceWorkerOverrideForTypical: true,
            path: swDir,
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: swDir },
            allowLocalhostAsSecureOrigin: true
          });

          window.__oneSignalInstance = OneSignal;
          window.__oneSignalReady = true;

          // Se il browser ha già il permesso notifiche concesso, assicura l'effettiva registrazione
          // del dispositivo con il Service Worker dedicato di OneSignal
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            try {
              const sub = OneSignal.User && OneSignal.User.PushSubscription;
              if (sub && (!sub.optedIn || !sub.id || !sub.token)) {
                await sub.optIn();
              }
            } catch (e) {
              console.warn('[OneSignal] Errore auto-registrazione:', e);
            }
          }

          const currentLang = localStorage.getItem('vicini_lang') || 'it';
          if (OneSignal.User && OneSignal.User.setLanguage) {
            try {
              await OneSignal.User.setLanguage(currentLang);
            } catch (e) {}
          }
        } catch (initErr) {
          window.__oneSignalInitError = initErr?.message || String(initErr);
          console.error('[OneSignal] Errore inizializzazione:', initErr);
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
