<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d7f57"/>
      <stop offset="50%" stop-color="#145e3f"/>
      <stop offset="100%" stop-color="#0e3a27"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4cd596" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#145e3f" stop-opacity="0"/>
    </radialGradient>

    <!-- Circle/Orb Gradient -->
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fe8b5"/>
      <stop offset="100%" stop-color="#26b879"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#051f14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Rect with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#centerGlow)"/>
  
  <!-- Subtle inner border stroke -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Hands Holding Circle Icon (Centered and Scaled) -->
  <!-- ViewBox 640x512 scaled to fit 310px width centered at 256, 256 -->
  <!-- scale = 320 / 640 = 0.5; translate to center: x = (512 - 320)/2 = 96, y = (512 - 256)/2 = 128 -->
  <g transform="translate(96, 128) scale(0.5)" filter="url(#softShadow)">
    <!-- Central Orb / Circle in Vibrant Emerald -->
    <path d="M320 0a128 128 0 1 1 0 256A128 128 0 1 1 320 0z" fill="url(#orbGrad)"/>
    
    <!-- Welcoming Hands in Pure White -->
    <path d="M40 64c22.1 0 40 17.9 40 40l0 40 0 80 0 40.2c0 17 6.7 33.3 18.7 45.3l51.1 51.1c8.3 8.3 21.3 9.6 31 3.1c12.9-8.6 14.7-26.9 3.7-37.8l-15.2-15.2-32-32c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l32 32 15.2 15.2c0 0 0 0 0 0l25.3 25.3c21 21 32.8 49.5 32.8 79.2l0 78.9c0 26.5-21.5 48-48 48l-66.7 0c-17 0-33.3-6.7-45.3-18.7L28.1 393.4C10.1 375.4 0 351 0 325.5L0 224l0-64 0-56C0 81.9 17.9 64 40 64zm560 0c22.1 0 40 17.9 40 40l0 56 0 64 0 101.5c0 25.5-10.1 49.9-28.1 67.9L512 493.3c-12 12-28.3 18.7-45.3 18.7L400 512c-26.5 0-48-21.5-48-48l0-78.9c0-29.7 11.8-58.2 32.8-79.2l25.3-25.3c0 0 0 0 0 0l15.2-15.2 32-32c12.5-12.5 32.8-12.5 45.3 0s12.5 32.8 0 45.3l-32 32-15.2 15.2c-11 11-9.2 29.2 3.7 37.8c9.7 6.5 22.7 5.2 31-3.1l51.1-51.1c12-12 18.7-28.3 18.7-45.3l0-40.2 0-80 0-40c0-22.1 17.9-40 40-40z" fill="#ffffff"/>
  </g>
</svg>